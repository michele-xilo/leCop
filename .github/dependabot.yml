version: 2
updates:
  # The workflows pin actions to commit SHAs. release.yml is generated by cargo-dist from dist-workspace.toml
  # (github-action-commits), so bump those SHAs there and run `dist generate`; drop release.yml hunks from these PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
