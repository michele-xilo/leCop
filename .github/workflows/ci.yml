name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint-build-test:
    name: Lint, build, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # The decode feature's AV1 assembly is built with nasm on x86_64.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo build --release --locked
      - run: cargo test --all-features --locked

  windows:
    name: Build, test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: choco install nasm -y --no-progress
      - run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The release binaries are built with asm, so this is the configuration to test.
      - run: cargo build --release --locked --features asm
      # A debug build fails to link openh264's nasm objects on MSVC (unresolved *_sse2 symbols); release links.
      - run: cargo test --release --locked --features asm --no-fail-fast

  # What `cargo install lecop` builds: default features, and no nasm on the machine.
  no-nasm:
    name: Build, test without nasm (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: sudo apt-get remove -y nasm || true
      - run: "! command -v nasm"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked
      - run: cargo test --locked

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # scan the full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      # The decode feature's AV1 assembly is built with nasm on x86_64.
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-llvm-cov
      # Floor, not a target: the CLI in main.rs is untested, the library is around 90%.
      - run: cargo llvm-cov --all-features --locked --lcov --output-path lcov.info --fail-under-lines 80
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --ignore-filename-regex '(tests|benches)/'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Without the CODECOV_TOKEN secret (forks, or before it is set) the upload is skipped and CI stays green.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lcov
          path: lcov.info
