[package]
name = "lecop"
version = "0.1.0"
edition = "2024"
description = "Fast health checks for LeRobot-format robot datasets (unofficial)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/michele-xilo/lecop"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
clap = { version = "4.6.7", features = ["derive"] }
parquet = { version = "60.1.0", features = ["arrow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "mp4"
harness = false
