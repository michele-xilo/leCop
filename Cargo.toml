[package]
name = "lecop"
version = "0.1.0"
edition = "2024"
description = "Fast health checks for LeRobot-format robot datasets (unofficial)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/michele-xilo/lecop"
readme = "README.md"

[features]
# Decoding video frames is opt-in: the default build reads container metadata only.
decode = ["dep:openh264", "dep:rav1d"]

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
openh264 = { version = "0.9.9", optional = true }
parquet = { version = "60.1.0", features = ["arrow"] }
rav1d = { version = "1.1.0", optional = true, default-features = false, features = ["bitdepth_8"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "mp4"
harness = false

[[bench]]
name = "validate"
harness = false
